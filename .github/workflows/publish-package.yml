name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.rel.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.apk" \
            --dir dist
          ls -lh dist

      - name: Configure Maven credentials
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish APK to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls dist/*.apk | head -n 1)
          mvn --batch-mode deploy:deploy-file \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DrepositoryId=github \
            -DgroupId=com.rahulmandal \
            -DartifactId=flashtransfer \
            -Dversion="${{ steps.rel.outputs.version }}" \
            -Dpackaging=apk \
            -Dfile="$APK" \
            -DgeneratePom=true \
            -s "$HOME/.m2/settings.xml"
